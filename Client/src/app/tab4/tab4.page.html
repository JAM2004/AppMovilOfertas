<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Notificaciones</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item *ngFor="let n of notifications">
      <ion-icon
        slot="start"
        size="medium"
        [name]="iconFor(n.kind)"
        [color]="colorFor(n.kind)"
      ></ion-icon>
      <ion-label>
        <h2>{{ n.message }}</h2>
        <p>{{ n.created_at }}</p>
      </ion-label>
    </ion-item>

    <ion-item *ngIf="notifications.length === 0">
      <ion-label class="ion-text-center">
        Aún no hay notificaciones. Cuando un producto baje de precio o aparezca
        una oferta, se registrará aquí.
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
