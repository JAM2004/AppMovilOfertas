<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ajustes</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-list-header>
      <ion-label>Sesiones por tienda</ion-label>
    </ion-list-header>

    <ng-container *ngFor="let store of settings">
      <!-- Tienda que requiere cookie: formulario para pegar la nueva. -->
      <ion-item *ngIf="store.requiresCookie">
        <ion-icon slot="start" name="key"></ion-icon>
        <ion-label>
          <h2>{{ store.name }}</h2>
          <p>
          <span *ngIf="store.hasCookie && store.updatedAt">Sesión activa. Renovada: {{ store.updatedAt }}</span>
          <span *ngIf="store.hasCookie && !store.updatedAt">Sesión activa (configurada en el servidor)</span>
          <ion-text *ngIf="!store.hasCookie" color="danger">Sin sesión configurada</ion-text>
          </p>
        </ion-label>
      </ion-item>

      <ion-item *ngIf="store.requiresCookie">
        <ion-textarea
          [(ngModel)]="cookieInput[store.id]"
          auto-grow="true"
          rows="3"
          placeholder="Pega aquí la cookie (DevTools → document.cookie)"
        ></ion-textarea>
        <ion-button
          slot="end"
          [disabled]="saving[store.id]"
          (click)="save(store)"
        >
          <ion-spinner *ngIf="saving[store.id]" name="crescent"></ion-spinner>
          <span *ngIf="!saving[store.id]">Guardar</span>
        </ion-button>
      </ion-item>

      <!-- Tienda que NO necesita cookie: solo informativa (p.ej. Steam). -->
      <ion-item *ngIf="!store.requiresCookie">
        <ion-icon slot="start" name="checkmark-circle"></ion-icon>
        <ion-label>
          <h2>{{ store.name }}</h2>
          <p>Usa su API pública, no requiere sesión.</p>
        </ion-label>
      </ion-item>
    </ng-container>

    <ion-item *ngIf="settings.length === 0">
      <ion-label class="ion-text-center">
        No se pudo obtener la lista de tiendas.
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
